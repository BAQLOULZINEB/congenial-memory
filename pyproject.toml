[project]
name = "talent-match"
version = "0.1.0"
description = "Analyseur intelligent de CV et d'offres d'emploi — EMSI 5AISDR G8"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "spacy>=3.8,<4",
  "numpy>=1.26,<3",
  "bcrypt>=5.0.0",
  "pyjwt>=2.15.1",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.20,<1",
  "huggingface-hub>=0.26,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
ui = [
    "streamlit>=1.40,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
